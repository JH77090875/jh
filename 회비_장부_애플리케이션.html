<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모임 회비 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 스크롤바 숨기기 (깔끔한 UI) */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }

        /* 탭 트랜지션 */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 로딩 스피너 */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen pb-20">

    <!-- 토스트 알림 컨테이너 -->
    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 w-[90%] max-w-sm pointer-events-none"></div>

    <!-- 로딩 오버레이 -->
    <div id="global-loading" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-[100] flex items-center justify-center hidden">
        <div class="bg-white p-5 rounded-2xl flex flex-col items-center shadow-xl">
            <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-3"></div>
            <p class="text-sm font-medium text-gray-600">처리 중...</p>
        </div>
    </div>

    <!-- 1. 로그인 / 장부 생성 화면 -->
    <div id="view-login" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 to-blue-100">
        <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-xl">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">모임 회비 장부</h1>
                <p class="text-sm text-gray-500 mt-2">새로 만들거나 기존 장부에 접속하세요.</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">장부 번호 (4자리 숫자)</label>
                    <div class="flex gap-2">
                        <input type="number" id="input-ledger-id" placeholder="예: 1234" pattern="\d{4}" class="flex-1 block w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-lg text-center font-semibold tracking-widest outline-none">
                        <button onclick="generateRandomLedgerId()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-medium transition-colors whitespace-nowrap">자동생성</button>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호 (4자리 숫자)</label>
                    <input type="number" id="input-ledger-pw" placeholder="****" pattern="\d{4}" onkeyup="if(event.key==='Enter') handleLogin()" class="block w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-lg text-center font-semibold tracking-widest outline-none">
                </div>

                <button onclick="handleLogin()" class="w-full flex justify-center items-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-base font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors mt-2">
                    접속하기 / 새 장부 만들기
                </button>
                <p class="text-xs text-center text-gray-500 mt-4">처음 입력하는 번호면 새 장부가 자동 생성됩니다.</p>
            </div>
        </div>
    </div>

    <!-- 2. 메인 애플리케이션 화면 -->
    <div id="view-main" class="hidden max-w-lg mx-auto w-full min-h-screen bg-gray-50 shadow-2xl relative">
        
        <!-- 상단 헤더 -->
        <header class="bg-white px-5 py-4 flex items-center justify-between sticky top-0 z-30 shadow-sm border-b border-gray-100">
            <div>
                <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <span id="display-ledger-id" class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-sm tracking-wider"></span>
                    장부
                </h2>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportToCSV()" class="flex items-center gap-1 px-2.5 py-1.5 bg-green-50 text-green-700 rounded-lg text-xs font-bold hover:bg-green-100 transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    엑셀
                </button>
                <button onclick="logout()" class="p-1.5 text-gray-400 hover:text-gray-600 transition-colors" title="로그아웃">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </header>

        <!-- 공통 설정 (기본 목표 금액) -->
        <div class="px-5 py-4 bg-white mb-2">
            <div class="flex items-center justify-between bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                <span class="text-sm font-medium text-indigo-900">1인당 기본 목표 회비</span>
                <div class="flex items-center gap-2">
                    <input type="number" id="input-default-target" class="w-24 text-right px-2 py-1 rounded bg-white border border-indigo-200 text-indigo-700 font-semibold focus:outline-none focus:ring-1 focus:ring-indigo-500" value="0">
                    <span class="text-sm text-indigo-700 font-medium">원</span>
                    <button onclick="updateDefaultTarget()" class="ml-1 px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-lg hover:bg-indigo-700">저장</button>
                </div>
            </div>
        </div>

        <!-- 탭 네비게이션 -->
        <div class="flex border-b border-gray-200 bg-white sticky top-[68px] z-20">
            <button onclick="switchTab('dashboard')" id="tab-btn-dashboard" class="flex-1 py-3 text-sm font-bold text-center border-b-2 border-indigo-600 text-indigo-600 transition-colors">대시보드</button>
            <button onclick="switchTab('categories')" id="tab-btn-categories" class="flex-1 py-3 text-sm font-bold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors">분류별 보기</button>
        </div>

        <!-- 탭 내용 영역 -->
        <div class="p-5">
            
            <!-- 대시보드 탭 -->
            <div id="tab-dashboard" class="tab-content active space-y-6">
                
                <!-- 요약 카드 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="text-sm font-medium text-gray-500 mb-1">현재까지 모인 총액</h3>
                    <div class="text-3xl font-bold text-gray-900 mb-4 tracking-tight"><span id="ui-total-collected">0</span><span class="text-lg text-gray-500 font-normal ml-1">원</span></div>
                    
                    <div class="mb-2 flex justify-between text-xs font-medium text-gray-500">
                        <span>전체 목표: <span id="ui-total-target">0</span>원</span>
                        <span>남은 금액: <span id="ui-total-remaining" class="text-rose-500">0</span>원</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
                        <div id="ui-progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <div class="text-right text-xs font-bold text-indigo-600 mt-1">달성률 <span id="ui-progress-percent">0</span>%</div>
                </div>

                <!-- 간편 입금 폼 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="text-base font-bold text-gray-900 mb-3 flex items-center gap-2">
                        <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        빠른 입금 기록
                    </h3>
                    
                    <div class="space-y-3">
                        <div class="flex gap-2">
                            <input type="text" id="deposit-name" placeholder="이름 입력" class="flex-1 w-1/3 px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
                            <div class="relative flex-1 w-2/3">
                                <input type="number" id="deposit-amount" placeholder="금액 입력" class="w-full pl-3 pr-8 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-semibold text-right">
                                <span class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 text-sm font-medium">원</span>
                            </div>
                        </div>
                        
                        <!-- 빠른 금액 버튼 -->
                        <div class="flex flex-wrap gap-1.5">
                            <button onclick="addAmountToInput(10000)" class="flex-1 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-xs font-medium transition-colors">+1만</button>
                            <button onclick="addAmountToInput(30000)" class="flex-1 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-xs font-medium transition-colors">+3만</button>
                            <button onclick="addAmountToInput(50000)" class="flex-1 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-xs font-medium transition-colors">+5만</button>
                            <button onclick="addAmountToInput(100000)" class="flex-1 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-xs font-medium transition-colors">+10만</button>
                            <button onclick="addAmountToInput(500000)" class="flex-1 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-xs font-medium transition-colors">+50만</button>
                            <button onclick="addFullTargetToInput()" class="flex-[2] py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 rounded-lg text-xs font-bold transition-colors">목표액 전액</button>
                        </div>

                        <button onclick="submitDeposit()" class="w-full py-3 bg-gray-900 text-white rounded-xl font-bold text-sm hover:bg-gray-800 transition-colors mt-2 shadow-sm">
                            기록하기
                        </button>
                    </div>
                </div>

                <!-- 멤버 현황 리스트 -->
                <div>
                    <h3 class="text-base font-bold text-gray-900 mb-3 ml-1">개인별 납부 현황 <span id="ui-member-count" class="text-gray-400 font-normal text-sm ml-1">(0명)</span></h3>
                    <div id="member-list-container" class="space-y-3">
                        <!-- JS로 카드 렌더링 -->
                    </div>
                </div>
            </div>

            <!-- 분류별 보기 탭 -->
            <div id="tab-categories" class="tab-content space-y-5">
                
                <!-- 뒤로가기 버튼 -->
                <div class="pt-2">
                    <button onclick="switchTab('dashboard')" class="flex items-center gap-1 text-sm font-bold text-gray-600 hover:text-gray-900 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        대시보드로 돌아가기
                    </button>
                </div>

                <!-- 상단 필터 (직책/성별) 다중 선택 가능 -->
                <div class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-1">
                    <button onclick="toggleCategoryFilter('all')" id="cat-btn-all" class="cat-btn flex-1 min-w-[70px] py-2 rounded-lg text-sm font-medium transition-colors bg-indigo-600 text-white shadow-md">전체</button>
                    <button onclick="toggleCategoryFilter('순장')" id="cat-btn-순장" class="cat-btn flex-1 min-w-[70px] py-2 rounded-lg text-sm font-medium transition-colors bg-gray-100 text-gray-600 hover:bg-gray-200">순장</button>
                    <button onclick="toggleCategoryFilter('순원')" id="cat-btn-순원" class="cat-btn flex-1 min-w-[70px] py-2 rounded-lg text-sm font-medium transition-colors bg-gray-100 text-gray-600 hover:bg-gray-200">순원</button>
                    <button onclick="toggleCategoryFilter('형제')" id="cat-btn-형제" class="cat-btn flex-1 min-w-[70px] py-2 rounded-lg text-sm font-medium transition-colors bg-gray-100 text-gray-600 hover:bg-gray-200">형제</button>
                    <button onclick="toggleCategoryFilter('자매')" id="cat-btn-자매" class="cat-btn flex-1 min-w-[70px] py-2 rounded-lg text-sm font-medium transition-colors bg-gray-100 text-gray-600 hover:bg-gray-200">자매</button>
                </div>

                <!-- 그룹 통계 요약 -->
                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 flex justify-between items-center">
                    <div>
                        <div class="text-xs font-medium text-indigo-800 mb-1"><span id="cat-title" class="font-bold">전체</span> 통계</div>
                        <div class="text-sm font-bold text-gray-900">모인 금액: <span id="cat-collected" class="text-indigo-600">0</span>원</div>
                        <div class="text-xs text-gray-600 mt-0.5">남은 금액: <span id="cat-remaining">0</span>원</div>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl font-black text-indigo-700 tracking-tighter" id="cat-count-ratio">0/0</div>
                        <div class="text-[10px] font-bold text-indigo-400">완납 인원</div>
                    </div>
                </div>

                <!-- 상태 필터 및 복사 버튼 -->
                <div class="flex items-center justify-between">
                    <div class="flex bg-gray-200 rounded-lg p-1">
                        <button onclick="setStatusFilter('all')" id="status-btn-all" class="status-btn px-3 py-1.5 rounded-md text-xs font-bold bg-white text-gray-800 shadow-sm">전체보기</button>
                        <button onclick="setStatusFilter('unpaid')" id="status-btn-unpaid" class="status-btn px-3 py-1.5 rounded-md text-xs font-bold text-gray-500 hover:text-gray-800">미납자만</button>
                        <button onclick="setStatusFilter('paid')" id="status-btn-paid" class="status-btn px-3 py-1.5 rounded-md text-xs font-bold text-gray-500 hover:text-gray-800">완납자만</button>
                    </div>
                    <button onclick="copyCategoryStatus()" class="flex items-center gap-1 px-3 py-1.5 bg-gray-800 text-white rounded-lg text-xs font-bold hover:bg-gray-700 transition-colors shadow-sm">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        카톡 복사
                    </button>
                </div>

                <!-- 분류된 멤버 리스트 -->
                <div id="category-member-list" class="space-y-3 pb-10">
                    <!-- JS로 렌더링 -->
                </div>

            </div>
        </div>
    </div>

    <!-- 3. 멤버 수정 모달 -->
    <div id="modal-member-edit" class="fixed inset-0 modal-overlay z-50 flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300 relative">
            <button onclick="closeMemberModal()" class="absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-600 bg-gray-50 rounded-full">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <h3 class="text-xl font-bold text-gray-900 mb-1" id="modal-member-name">멤버 이름</h3>
            <p class="text-xs text-gray-500 mb-6">개인별 목표 금액과 역할을 설정하세요.</p>

            <div class="space-y-5">
                <!-- 역할/성별 설정 -->
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-700 mb-2">직책</label>
                        <div class="flex bg-gray-100 rounded-lg p-1 w-full">
                            <label class="flex-1 text-center">
                                <input type="radio" name="modal-role" value="" class="peer sr-only" checked>
                                <div class="py-2 rounded-md text-sm font-medium text-gray-500 cursor-pointer peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all">없음</div>
                            </label>
                            <label class="flex-1 text-center">
                                <input type="radio" name="modal-role" value="순장" class="peer sr-only">
                                <div class="py-2 rounded-md text-sm font-medium text-gray-500 cursor-pointer peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all">순장</div>
                            </label>
                            <label class="flex-1 text-center">
                                <input type="radio" name="modal-role" value="순원" class="peer sr-only">
                                <div class="py-2 rounded-md text-sm font-medium text-gray-500 cursor-pointer peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all">순원</div>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-700 mb-2">성별</label>
                        <div class="flex bg-gray-100 rounded-lg p-1 w-full">
                            <label class="flex-1 text-center">
                                <input type="radio" name="modal-gender" value="" class="peer sr-only" checked>
                                <div class="py-2 rounded-md text-sm font-medium text-gray-500 cursor-pointer peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-sm transition-all">미지정</div>
                            </label>
                            <label class="flex-1 text-center">
                                <input type="radio" name="modal-gender" value="형제" class="peer sr-only">
                                <div class="py-2 rounded-md text-sm font-medium text-gray-500 cursor-pointer peer-checked:bg-white peer-checked:text-blue-600 peer-checked:shadow-sm transition-all">형제</div>
                            </label>
                            <label class="flex-1 text-center">
                                <input type="radio" name="modal-gender" value="자매" class="peer sr-only">
                                <div class="py-2 rounded-md text-sm font-medium text-gray-500 cursor-pointer peer-checked:bg-white peer-checked:text-pink-600 peer-checked:shadow-sm transition-all">자매</div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 개인 목표 설정 -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-bold text-gray-700">개인별 목표 회비 (선택)</label>
                        <button onclick="clearCustomTarget()" class="text-[10px] text-gray-400 hover:text-gray-600 underline">기본값 사용</button>
                    </div>
                    <div class="relative">
                        <input type="number" id="modal-custom-target" placeholder="미입력시 기본 목표액 적용" class="w-full pl-4 pr-8 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-semibold text-right">
                        <span class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 text-sm">원</span>
                    </div>
                </div>

                <div class="pt-2 flex gap-2">
                    <button onclick="deleteMemberConfirm()" class="px-4 py-3 bg-red-50 text-red-600 rounded-xl text-sm font-bold hover:bg-red-100 transition-colors">삭제</button>
                    <button onclick="saveMemberEdit()" class="flex-1 py-3 bg-gray-900 text-white rounded-xl text-sm font-bold hover:bg-gray-800 transition-colors shadow-sm">설정 저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase 및 로직 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 환경 변수 설정 (안정적인 파싱 적용)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'fee-ledger-app';
        let firebaseConfig = null;
        
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            try {
                firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
            } catch(e) {
                console.warn("Firebase config parsing error");
            }
        }

        let app, db, auth;
        let isDbConnected = false;
        
        try {
            if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                isDbConnected = true;
            } else {
                console.error("Firebase 설정이 없습니다.");
            }
        } catch (e) {
            console.error("Firebase 초기화 실패:", e);
        }

        // 애플리케이션 상태
        const state = {
            isLoggedIn: false,
            ledgerId: null,
            ledgerData: {
                password: '',
                defaultTarget: 0,
                members: []
            },
            unsubscribe: null,
            editingMemberId: null,
            
            // 필터 상태
            activeFilters: [], // 다중 필터 선택용 배열 (비어있으면 '전체')
            statusFilter: 'all' // 'all', 'paid', 'unpaid'
        };

        // 유틸리티 함수
        const formatMoney = (num) => new Intl.NumberFormat('ko-KR').format(num || 0);
        
        window.showToast = function(message, type = 'normal') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-gray-800 text-white';
            if (type === 'error') bgClass = 'bg-red-600 text-white';
            if (type === 'success') bgClass = 'bg-green-600 text-white';

            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center justify-between transform translate-y-[-20px] opacity-0 transition-all duration-300`;
            toast.innerHTML = `<span>${message}</span>`;
            
            container.appendChild(toast);
            
            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-20px]', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'scale-95');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        function showLoading() { document.getElementById('global-loading').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('global-loading').classList.add('hidden'); }

        // 장부 번호 자동 생성
        window.generateRandomLedgerId = function() {
            const id = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('input-ledger-id').value = id;
            showToast('새 장부 번호가 생성되었습니다.');
        };

        // 인증 초기화 및 로그인 처리
        async function initAuth() {
            if (!auth) return false;
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                return true;
            } catch (error) {
                console.error("Auth error:", error);
                showToast('인증에 실패했습니다. 새로고침 해주세요.', 'error');
                return false;
            }
        }

        window.handleLogin = async function() {
            const ledgerId = document.getElementById('input-ledger-id').value.trim();
            const password = document.getElementById('input-ledger-pw').value.trim();

            if (!/^\d{4}$/.test(ledgerId) || !/^\d{4}$/.test(password)) {
                showToast('장부 번호와 비밀번호는 모두 4자리 숫자여야 합니다.', 'error');
                return;
            }

            // 진짜 장부 앱으로 사용하기 위해 무조건 DB 연결 요구 (임시 모드 폐지)
            if (!isDbConnected || !db || !auth) {
                showToast('서버에 연결할 수 없습니다. 정식 공유 링크로 접속해주세요.', 'error');
                return;
            }

            showLoading();
            const authSuccess = await initAuth();
            if (!authSuccess) { hideLoading(); return; }

            const ledgersRef = collection(db, 'artifacts', appId, 'public', 'data', 'ledgers');
            const docRef = doc(ledgersRef, ledgerId);

            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    // 기존 장부 접속
                    if (docSnap.data().password === password) {
                        state.ledgerId = ledgerId;
                        startListening(docRef);
                        switchToMainView();
                        showToast('장부에 접속했습니다.', 'success');
                    } else {
                        showToast('비밀번호가 일치하지 않습니다.', 'error');
                    }
                } else {
                    // 새 장부 생성
                    const newData = {
                        password: password,
                        defaultTarget: 50000,
                        members: []
                    };
                    await setDoc(docRef, newData);
                    state.ledgerId = ledgerId;
                    startListening(docRef);
                    switchToMainView();
                    showToast('새 장부가 생성되었습니다.', 'success');
                }
            } catch (error) {
                console.error("Login Error:", error);
                showToast('데이터베이스 접근 중 오류가 발생했습니다.', 'error');
            }
            hideLoading();
        };

        window.logout = function() {
            if (state.unsubscribe) state.unsubscribe();
            state.isLoggedIn = false;
            state.ledgerId = null;
            
            // 데이터 비우기
            state.ledgerData = { password: '', defaultTarget: 0, members: [] };
            
            document.getElementById('view-main').classList.add('hidden');
            document.getElementById('view-login').classList.remove('hidden');
            document.getElementById('input-ledger-pw').value = '';
            showToast('로그아웃 되었습니다.');
        };

        function switchToMainView() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-main').classList.remove('hidden');
            document.getElementById('display-ledger-id').innerText = state.ledgerId;
            state.isLoggedIn = true;
        }

        // 실시간 데이터 리스너
        function startListening(docRef) {
            if (state.unsubscribe) state.unsubscribe();
            
            state.unsubscribe = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    state.ledgerData = docSnap.data();
                    // members 배열이 없는 구버전 호환 또는 에러 방지
                    if (!state.ledgerData.members) state.ledgerData.members = [];
                    updateUI();
                } else {
                    showToast('장부가 삭제되었거나 존재하지 않습니다.', 'error');
                    logout();
                }
            }, (error) => {
                console.error("Snapshot error:", error);
                showToast('실시간 동기화 오류 발생', 'error');
            });
        }

        // Firestore 업데이트 헬퍼
        async function saveLedgerData() {
            if (!isDbConnected || !state.ledgerId || !auth?.currentUser) {
                showToast('서버 연결 오류로 저장되지 않았습니다.', 'error');
                return;
            }
            
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'ledgers', state.ledgerId);
            try {
                await updateDoc(docRef, {
                    defaultTarget: state.ledgerData.defaultTarget,
                    members: state.ledgerData.members
                });
            } catch (e) {
                console.error("Update error:", e);
                showToast('데이터 저장 실패', 'error');
            }
        }

        // 데이터 계산 헬퍼
        function getMemberTarget(member) {
            if (member.customTarget !== null && member.customTarget !== undefined) {
                return Number(member.customTarget);
            }
            return Number(state.ledgerData.defaultTarget) || 0;
        }

        function getMemberRemaining(member) {
            const target = getMemberTarget(member);
            return Math.max(0, target - (member.paidAmount || 0));
        }

        // UI 업데이트 로직 (전체)
        function updateUI() {
            // 기본 설정 업데이트
            document.getElementById('input-default-target').value = state.ledgerData.defaultTarget;
            
            renderDashboard();
            renderCategoryView();
        }

        // ----------------------------------------------------
        // 대시보드 탭 로직
        // ----------------------------------------------------
        
        window.updateDefaultTarget = async function() {
            const val = Number(document.getElementById('input-default-target').value);
            state.ledgerData.defaultTarget = val;
            await saveLedgerData();
            showToast('기본 목표액이 저장되었습니다.');
        };

        window.addAmountToInput = function(amount) {
            const input = document.getElementById('deposit-amount');
            let current = Number(input.value) || 0;
            input.value = current + amount;
        };

        window.addFullTargetToInput = function() {
            const nameInput = document.getElementById('deposit-name').value.trim();
            let targetAmt = Number(state.ledgerData.defaultTarget);

            if (nameInput) {
                const member = state.ledgerData.members.find(m => m.name === nameInput);
                if (member) {
                    targetAmt = getMemberTarget(member);
                }
            }
            document.getElementById('deposit-amount').value = targetAmt;
        };

        window.submitDeposit = async function() {
            const name = document.getElementById('deposit-name').value.trim();
            const amount = Number(document.getElementById('deposit-amount').value);

            if (!name) { showToast('이름을 입력해주세요.', 'error'); return; }
            if (!amount || amount <= 0) { showToast('금액을 올바르게 입력해주세요.', 'error'); return; }

            const members = [...state.ledgerData.members];
            let member = members.find(m => m.name === name);

            if (member) {
                member.paidAmount = (Number(member.paidAmount) || 0) + amount;
            } else {
                member = {
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    name: name,
                    paidAmount: amount,
                    customTarget: null,
                    role: '',
                    gender: ''
                };
                members.push(member);
            }

            state.ledgerData.members = members;
            await saveLedgerData();
            
            showToast(`${name}님 ${formatMoney(amount)}원 등록 완료!`, 'success');
            document.getElementById('deposit-name').value = '';
            document.getElementById('deposit-amount').value = '';
        };

        window.fillBalance = async function(memberId) {
            const members = [...state.ledgerData.members];
            const memberIndex = members.findIndex(m => m.id === memberId);
            if (memberIndex === -1) return;

            const member = members[memberIndex];
            const remaining = getMemberRemaining(member);
            
            if (remaining > 0) {
                member.paidAmount = (Number(member.paidAmount) || 0) + remaining;
                state.ledgerData.members = members;
                await saveLedgerData();
                showToast(`${member.name}님 잔액 완납 처리되었습니다.`, 'success');
            }
        };

        function renderDashboard() {
            const members = state.ledgerData.members;
            
            let totalCollected = 0;
            let totalTarget = 0;

            members.forEach(m => {
                totalCollected += Number(m.paidAmount) || 0;
                totalTarget += getMemberTarget(m);
            });

            const totalRemaining = Math.max(0, totalTarget - totalCollected);
            const progress = totalTarget > 0 ? Math.min(100, Math.round((totalCollected / totalTarget) * 100)) : 0;

            // 요약 반영
            document.getElementById('ui-total-collected').innerText = formatMoney(totalCollected);
            document.getElementById('ui-total-target').innerText = formatMoney(totalTarget);
            document.getElementById('ui-total-remaining').innerText = formatMoney(totalRemaining);
            document.getElementById('ui-progress-bar').style.width = `${progress}%`;
            document.getElementById('ui-progress-percent').innerText = progress;
            document.getElementById('ui-member-count').innerText = `(${members.length}명)`;

            // 멤버 리스트 렌더링
            const container = document.getElementById('member-list-container');
            container.innerHTML = '';

            // 최신순(배열 역순) 또는 이름순 정렬. (이름순 적용)
            const sortedMembers = [...members].sort((a, b) => a.name.localeCompare(b.name));

            if (sortedMembers.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-sm text-gray-400 bg-white rounded-2xl border border-gray-100">아직 등록된 인원이 없습니다.</div>`;
                return;
            }

            sortedMembers.forEach(m => {
                const target = getMemberTarget(m);
                const paid = Number(m.paidAmount) || 0;
                const remaining = Math.max(0, target - paid);
                const isCompleted = paid >= target && target > 0;
                
                // 뱃지
                let badges = '';
                if (m.role) badges += `<span class="px-1.5 py-0.5 bg-gray-100 text-gray-600 rounded text-[10px] font-bold">${m.role}</span>`;
                if (m.gender === '형제') badges += `<span class="px-1.5 py-0.5 bg-blue-50 text-blue-600 rounded text-[10px] font-bold">형제</span>`;
                if (m.gender === '자매') badges += `<span class="px-1.5 py-0.5 bg-pink-50 text-pink-600 rounded text-[10px] font-bold">자매</span>`;

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between";
                
                let actionBtn = isCompleted 
                    ? `<span class="text-xs font-bold text-green-600 bg-green-50 px-2 py-1 rounded-md border border-green-200">완납</span>`
                    : `<button onclick="fillBalance('${m.id}')" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md border border-indigo-200 hover:bg-indigo-100 transition-colors whitespace-nowrap">잔액채우기</button>`;

                card.innerHTML = `
                    <div class="flex-1 min-w-0" onclick="openMemberModal('${m.id}')" style="cursor: pointer;">
                        <div class="flex items-center gap-1.5 mb-1">
                            <h4 class="font-bold text-gray-900 truncate">${m.name}</h4>
                            <div class="flex gap-1">${badges}</div>
                        </div>
                        <div class="flex items-baseline gap-2">
                            <span class="text-sm font-bold text-gray-800">${formatMoney(paid)}원</span>
                            <span class="text-xs text-gray-400">/ ${formatMoney(target)}</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-1.5 ml-3">
                        ${actionBtn}
                        ${!isCompleted ? `<div class="text-[11px] text-rose-500 font-medium whitespace-nowrap">잔액: ${formatMoney(remaining)}원</div>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }


        // ----------------------------------------------------
        // 멤버 설정 모달 로직
        // ----------------------------------------------------
        window.openMemberModal = function(id) {
            const member = state.ledgerData.members.find(m => m.id === id);
            if (!member) return;

            state.editingMemberId = id;
            document.getElementById('modal-member-name').innerText = member.name;
            
            // 라디오 버튼 세팅
            document.querySelectorAll('input[name="modal-role"]').forEach(el => {
                el.checked = (el.value === (member.role || ''));
            });
            document.querySelectorAll('input[name="modal-gender"]').forEach(el => {
                el.checked = (el.value === (member.gender || ''));
            });

            document.getElementById('modal-custom-target').value = (member.customTarget !== null && member.customTarget !== undefined) ? member.customTarget : '';

            const modal = document.getElementById('modal-member-edit');
            const inner = modal.querySelector('div');
            modal.classList.remove('hidden');
            // 애니메이션을 위해 강제 리플로우
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            inner.classList.remove('translate-y-full', 'sm:translate-y-full');
        };

        window.closeMemberModal = function() {
            const modal = document.getElementById('modal-member-edit');
            const inner = modal.querySelector('div');
            
            modal.classList.add('opacity-0');
            inner.classList.add('translate-y-full', 'sm:translate-y-full');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                state.editingMemberId = null;
            }, 300); // transition 시간과 일치
        };

        window.clearCustomTarget = function() {
            document.getElementById('modal-custom-target').value = '';
            showToast('기본 목표액이 적용됩니다.');
        };

        window.saveMemberEdit = async function() {
            if (!state.editingMemberId) return;

            const role = document.querySelector('input[name="modal-role"]:checked').value;
            const gender = document.querySelector('input[name="modal-gender"]:checked').value;
            const customTargetVal = document.getElementById('modal-custom-target').value;
            
            const members = [...state.ledgerData.members];
            const idx = members.findIndex(m => m.id === state.editingMemberId);
            if (idx > -1) {
                members[idx].role = role;
                members[idx].gender = gender;
                members[idx].customTarget = customTargetVal === '' ? null : Number(customTargetVal);
                
                state.ledgerData.members = members;
                await saveLedgerData();
                showToast('멤버 정보가 저장되었습니다.', 'success');
                closeMemberModal();
            }
        };

        window.deleteMemberConfirm = async function() {
            if (!state.editingMemberId) return;
            // iframe 내 alert/confirm 금지에 따라 단순 삭제 진행 (실제 상용에선 별도 커스텀 모달 권장)
            // 여기서는 바로 삭제 후 토스트 띄움. 
            // 삭제를 위한 이중 체크용 토스트를 구현하기 복잡하므로 바로 삭제
            const members = state.ledgerData.members.filter(m => m.id !== state.editingMemberId);
            state.ledgerData.members = members;
            await saveLedgerData();
            showToast('멤버가 삭제되었습니다.');
            closeMemberModal();
        }

        // ----------------------------------------------------
        // 분류별 보기 탭 로직
        // ----------------------------------------------------
        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');

            const btnDash = document.getElementById('tab-btn-dashboard');
            const btnCat = document.getElementById('tab-btn-categories');

            if (tabName === 'dashboard') {
                btnDash.className = "flex-1 py-3 text-sm font-bold text-center border-b-2 border-indigo-600 text-indigo-600 transition-colors";
                btnCat.className = "flex-1 py-3 text-sm font-bold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors";
            } else {
                btnCat.className = "flex-1 py-3 text-sm font-bold text-center border-b-2 border-indigo-600 text-indigo-600 transition-colors";
                btnDash.className = "flex-1 py-3 text-sm font-bold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors";
                renderCategoryView(); // 탭 이동 시 렌더링 보장
            }
        };

        window.toggleCategoryFilter = function(filter) {
            if (filter === 'all') {
                state.activeFilters = [];
            } else {
                const idx = state.activeFilters.indexOf(filter);
                if (idx > -1) {
                    state.activeFilters.splice(idx, 1); // 이미 선택된 버튼이면 해제
                } else {
                    state.activeFilters.push(filter); // 새로 선택된 버튼이면 추가
                }
            }
            
            // 버튼 스타일 업데이트
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn flex-1 min-w-[70px] py-2 rounded-lg text-sm font-medium transition-colors bg-gray-100 text-gray-600 hover:bg-gray-200";
            });
            
            if (state.activeFilters.length === 0) {
                const activeBtn = document.getElementById('cat-btn-all');
                if(activeBtn) activeBtn.className = "cat-btn flex-1 min-w-[70px] py-2 rounded-lg text-sm font-medium transition-colors bg-indigo-600 text-white shadow-md";
                document.getElementById('cat-title').innerText = '전체';
            } else {
                state.activeFilters.forEach(f => {
                    const activeBtn = document.getElementById(`cat-btn-${f}`);
                    if(activeBtn) activeBtn.className = "cat-btn flex-1 min-w-[70px] py-2 rounded-lg text-sm font-medium transition-colors bg-indigo-600 text-white shadow-md";
                });
                document.getElementById('cat-title').innerText = state.activeFilters.join(', ');
            }
            
            renderCategoryView();
        };

        window.setStatusFilter = function(status) {
            state.statusFilter = status;
            
            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.className = "status-btn px-3 py-1.5 rounded-md text-xs font-bold text-gray-500 hover:text-gray-800 transition-colors";
            });
            const activeBtn = document.getElementById(`status-btn-${status}`);
            if(activeBtn) {
                activeBtn.className = "status-btn px-3 py-1.5 rounded-md text-xs font-bold bg-white text-gray-800 shadow-sm";
            }
            renderCategoryView();
        };

        function getFilteredMembers() {
            let filtered = state.ledgerData.members;

            // 1. 다중 카테고리 필터 (교집합 로직)
            if (state.activeFilters.length > 0) {
                const roleFilters = state.activeFilters.filter(f => f === '순장' || f === '순원');
                const genderFilters = state.activeFilters.filter(f => f === '형제' || f === '자매');
                
                filtered = filtered.filter(m => {
                    const passRole = roleFilters.length === 0 || roleFilters.includes(m.role);
                    const passGender = genderFilters.length === 0 || genderFilters.includes(m.gender);
                    return passRole && passGender;
                });
            }

            // 2. 상태 필터
            if (state.statusFilter === 'paid') {
                filtered = filtered.filter(m => {
                    const t = getMemberTarget(m);
                    return (Number(m.paidAmount) || 0) >= t && t > 0;
                });
            } else if (state.statusFilter === 'unpaid') {
                filtered = filtered.filter(m => {
                    const t = getMemberTarget(m);
                    return (Number(m.paidAmount) || 0) < t || t === 0;
                });
            }

            // 이름순 정렬
            return filtered.sort((a, b) => a.name.localeCompare(b.name));
        }

        function renderCategoryView() {
            // 통계는 상태(status) 필터 무관하게 '선택된 다중 카테고리' 전체 기준으로 계산
            let baseGroup = state.ledgerData.members;
            if (state.activeFilters.length > 0) {
                const roleFilters = state.activeFilters.filter(f => f === '순장' || f === '순원');
                const genderFilters = state.activeFilters.filter(f => f === '형제' || f === '자매');
                
                baseGroup = baseGroup.filter(m => {
                    const passRole = roleFilters.length === 0 || roleFilters.includes(m.role);
                    const passGender = genderFilters.length === 0 || genderFilters.includes(m.gender);
                    return passRole && passGender;
                });
            }

            let grpCollected = 0;
            let grpTarget = 0;
            let grpPaidCount = 0;

            baseGroup.forEach(m => {
                const paid = Number(m.paidAmount) || 0;
                const target = getMemberTarget(m);
                grpCollected += paid;
                grpTarget += target;
                if (paid >= target && target > 0) grpPaidCount++;
            });

            const grpRemaining = Math.max(0, grpTarget - grpCollected);

            document.getElementById('cat-collected').innerText = formatMoney(grpCollected);
            document.getElementById('cat-remaining').innerText = formatMoney(grpRemaining);
            document.getElementById('cat-count-ratio').innerText = `${grpPaidCount}/${baseGroup.length}`;

            // 리스트 렌더링
            const container = document.getElementById('category-member-list');
            container.innerHTML = '';
            
            const displayMembers = getFilteredMembers();

            if (displayMembers.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-sm text-gray-400 bg-white rounded-xl border border-gray-100">조건에 맞는 인원이 없습니다.</div>`;
                return;
            }

            displayMembers.forEach(m => {
                const target = getMemberTarget(m);
                const paid = Number(m.paidAmount) || 0;
                const remaining = Math.max(0, target - paid);
                const isCompleted = paid >= target && target > 0;

                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between";
                
                card.innerHTML = `
                    <div class="flex items-center gap-2">
                        ${isCompleted 
                            ? `<svg class="w-5 h-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>` 
                            : `<svg class="w-5 h-5 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`
                        }
                        <div>
                            <div class="text-sm font-bold text-gray-900">${m.name}</div>
                            <div class="text-xs text-gray-500">납부 ${formatMoney(paid)}원</div>
                        </div>
                    </div>
                    <div class="text-right">
                        ${!isCompleted ? `<div class="text-xs font-bold text-rose-500 mb-0.5">미납 ${formatMoney(remaining)}원</div>` : `<div class="text-xs font-bold text-green-600 mb-0.5">완납</div>`}
                        <div class="text-[10px] text-gray-400">목표 ${formatMoney(target)}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.copyCategoryStatus = function() {
            const groupName = state.activeFilters.length === 0 ? '전체' : state.activeFilters.join(', ');
            const members = getFilteredMembers();
            
            let text = `[${groupName} 회비 현황]\n\n`;
            
            if (members.length === 0) {
                text += "해당되는 인원이 없습니다.";
            } else {
                members.forEach(m => {
                    const target = getMemberTarget(m);
                    const paid = Number(m.paidAmount) || 0;
                    const isCompleted = paid >= target && target > 0;
                    
                    if (isCompleted) {
                        text += `- ${m.name} : 완납\n`;
                    } else {
                        const remaining = Math.max(0, target - paid);
                        text += `- ${m.name} : 미납 ${formatMoney(remaining)}원\n`;
                    }
                });
            }
            
            text += `\n* 실시간 확인 장부 번호: ${state.ledgerId}`;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text)
                    .then(() => showToast('현황이 복사되었습니다.', 'success'))
                    .catch(() => fallbackCopyTextToClipboard(text));
            } else {
                fallbackCopyTextToClipboard(text);
            }
        };

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) showToast('현황이 클립보드에 복사되었습니다.', 'success');
                else showToast('복사에 실패했습니다.', 'error');
            } catch (err) {
                showToast('브라우저에서 복사를 지원하지 않습니다.', 'error');
            }
            document.body.removeChild(textArea);
        }

        window.exportToCSV = function() {
            if (!state.ledgerData.members || state.ledgerData.members.length === 0) {
                showToast('내보낼 데이터가 없습니다.', 'error');
                return;
            }

            // 한글 깨짐 방지를 위한 BOM(\uFEFF) 추가
            let csvContent = "\uFEFF이름,직책,성별,납부액,목표액,미납액,상태\n";
            
            const sortedMembers = [...state.ledgerData.members].sort((a, b) => a.name.localeCompare(b.name));
            
            sortedMembers.forEach(m => {
                const role = m.role || '없음';
                const gender = m.gender || '미지정';
                const paid = Number(m.paidAmount) || 0;
                const target = getMemberTarget(m);
                const remaining = Math.max(0, target - paid);
                const status = (paid >= target && target > 0) ? '완납' : '미납';
                
                csvContent += `${m.name},${role},${gender},${paid},${target},${remaining},${status}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            
            link.setAttribute("href", url);
            link.setAttribute("download", `회비장부_${state.ledgerId}_${new Date().toISOString().slice(0,10)}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast('엑셀(CSV) 파일이 다운로드되었습니다.', 'success');
        };

    </script>
</body>
</html>
